<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marca Mutante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div class="picker-palette">
            <button class="picker-tab active" data-target="logoView">Cores do Logo</button>
            <button class="picker-tab" data-target="colorView">Combinação de cores</button>
        </div>

        <div class="controls-stack">
            <button id="randomBtn" class="primary-btn">Gerar número aleatório</button>
            
            <div class="input-row">
                <input type="number" id="positionInput" min="1" max="5040" placeholder="opção">
            </div>

            <hr>

            <p id="numberSequenceOutput" class="subheadline">Opção dos números: </p>
        </div>

        <div class="views-container">
            
            <div id="logoView" class="view-panel">
                <svg id="mutantLogo" viewBox="-20 -20 720 380" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <style>
                            .cls-1 {
                                fill: #6a8fd2;
                            }
                            
                            .cls-2 {
                                fill: #90b69e; 
                            }

                            .cls-3 {
                                fill: #fc7b5f;
                            }

                            .cls-4 {
                                fill: #fb705e;
                            }

                            .cls-5 {
                                fill: #ffd88a;
                            }

                            .cls-7 {
                                fill: #988cd2;
                            }

                            .cls-8 {
                                fill: #75afda;
                            }

                            .cls-9 {
                                fill: #ff9d60;
                            }

                            .cls-10 {
                                fill: #e3d08f;
                            }

                            .cls-11 {
                                fill: #79badd;
                            }
                        </style>
                    </defs>
                    <g id="Camada_1-2" data-name="Camada 1">
                        <polygon class="cls-7 brand-part" points="365.86 0 365.86 321.15 510.32 160.58 365.86 0"/>
                        <g>
                            <rect class="cls-9 brand-part" x="18.32" y="189.26" width="123.84" height="103.2" transform="translate(-146.84 127.34) rotate(-45.01)"/>
                            <rect class="cls-4 brand-part" x="28.65" y="18.37" width="103.2" height="123.84" transform="translate(-33.27 80.28) rotate(-45.01)"/>
                            <polygon class="cls-3 brand-part" points="0 72.99 0 248.16 87.54 160.57 0 72.99"/>
                        </g>
                        <g>
                            <polygon class="cls-1 brand-part" points="188.44 160.57 326.85 160.57 326.85 240.86 326.85 321.15 188.44 321.15 188.44 160.57"/>
                            <polygon class="cls-11 brand-part" points="326.85 0 188.44 0 188.44 160.57 326.85 0"/>
                            <polygon class="cls-8 brand-part" points="188.44 160.57 326.85 160.57 326.85 0 188.44 160.57"/>
                        </g>
                        <g>
                            <polygon class="cls-5 brand-part" points="681.72 0 543.31 0 543.31 160.57 681.72 0"/>
                            <g>
                            <polygon class="cls-2 brand-part" points="543.31 160.57 681.71 160.57 681.71 240.86 681.71 321.15 543.31 321.15 543.31 160.57"/>
                            <polygon class="cls-10 brand-part" points="543.31 160.57 681.72 160.57 681.72 0 543.31 160.57"/>
                            <polygon class="cls-6 brand-part" points="629.52 197.82 629.55 197.85 629.52 197.89 629.52 197.82"/>
                            </g>
                        </g>
                    </g>
                </svg>
                
                <div class="actions-row">
                    <button id="exportBtn" class="secondary-btn">Exportar SVG</button>
                </div>
            </div>

            <div id="colorView" class="view-panel" style="display: none;">
                
                <div class="illustration-wrap">
                    <svg id="illustrationSvg" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
                        
                        <g transform="translate(40, -40) scale(0.85)">
                            <rect id="illus-3" x="29.58" y="305.83" width="199.65" height="166.38" transform="translate(-237.17 205.45) rotate(-45)" fill="#fecb5f"/>
                            <rect id="illus-5" x="46.22" y="30.37" width="166.38" height="199.65" transform="translate(-54.16 129.64) rotate(-45)" fill="#fc893c"/>
                            <polygon id="illus-8" points="0 118.43 0 400.78 141.18 259.61 0 118.43" fill="#fc7b5e"/>
                        </g>
                        
                    </svg>
                </div>

                <div class="color-pickers-row">
                    <div class="picker-group">
                        <label for="select3">Forma Base</label>
                        <select id="select3" class="color-select">
                            <option value="#90b69e">Verde</option>
                            <option value="#988cd2">Roxo</option>
                            <option value="#ffd88a" selected>Amarelo</option>
                            <option value="#6a8fd2">Azul escuro</option>
                            <option value="#ff9d60">Laranja</option>
                            <option value="#fb705e">Vermelho</option>
                            <option value="#79badd">Azul claro</option>
                        </select>
                    </div>
                    <div class="picker-group">
                        <label for="select5">Forma Topo</label>
                        <select id="select5" class="color-select">
                            <option value="#90b69e">Verde</option>
                            <option value="#988cd2">Roxo</option>
                            <option value="#ffd88a">Amarelo</option>
                            <option value="#6a8fd2">Azul escuro</option>
                            <option value="#ff9d60" selected>Laranja</option>
                            <option value="#fb705e">Vermelho</option>
                            <option value="#79badd">Azul claro</option>
                        </select>
                    </div>
                </div>
           
                <div> 
                    <span id="colorCode">{ffd88a} </span>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
